<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HTML5 media demonstration with video, audio and secure iframes.">
    <title>Media Demonstration | HTML5 Assessment</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Interactive HTML5 Assessment</h1>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Contact Form</a></li>
                    <li><a href="table.html">Product Comparison</a></li>
                    <li><a href="media.html" aria-current="page">Media Demonstration</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section aria-labelledby="media-heading">
            <h2 id="media-heading">HTML5 Media Demonstration</h2>
            <p>This page demonstrates native HTML5 media and secure embedded content.</p>

            <figure>
                <figcaption>HTML5 Video</figcaption>
                <video controls preload="metadata" width="720">
                    <source
                        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
                        type="video/mp4">
                    Your browser does not support HTML5 video.
                </video>
            </figure>

            <figure>
                <figcaption>HTML5 Audio</figcaption>
                <audio controls preload="metadata">
                    <source
                        src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
                        type="audio/mpeg">
                    Your browser does not support HTML5 audio.
                </audio>
            </figure>

            <figure>
                <figcaption>YouTube Embedded Video</figcaption>
                <iframe
                    width="560"
                    height="315"
                    src="https://www.youtube.com/embed/aqz-KE-bpKQ"
                    title="HTML5 video demonstration on YouTube"
                    sandbox="allow-scripts allow-same-origin allow-presentation"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </figure>

            <figure>
                <figcaption>Optional Google Map Embed</figcaption>
                <iframe
                    title="Google Maps example"
                    src="https://www.google.com/maps?q=Mumbai%20India&output=embed"
                    width="600"
                    height="350"
                    loading="lazy"
                    sandbox="allow-scripts allow-same-origin">
                </iframe>
            </figure>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 HTML5 Forms, Tables and Media Assessment.</p>
        </div>
    </footer>
</body>
</html>
